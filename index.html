    <!-- Onglets pour galeries et installation -->

    </div>

    <!-- Galerie 1 (par défaut) -->
    <div id="gallery1" class="gallery-container"></div>

    <!-- Galerie 2 (cachée) -->
    <div id="gallery2" class="gallery-container hidden" style="display:none;"></div>

    <!-- Installation Audiovisuelle (modale) -->
    <div id="installationOverlay" class="installation-overlay hidden" role="dialog" aria-label="Cyclops Sonoris - Installation audiovisuelle générative" style="display:none;">
        <div class="installation-content">
            <button id="installationLandscapeBtn" class="installation-landscape-btn" type="button" aria-pressed="false">Plein écran paysage</button>
            <button id="installationCloseBtn" class="installation-close-btn" aria-label="Fermer Cyclops Sonoris">Quitter</button>
            <canvas id="installationCanvas" class="installation-canvas" role="img" aria-label="Cyclops Sonoris - Installation audiovisuelle générative"></canvas>
        </div>
    </div>

    <footer>
        <section class="artist-signup" aria-labelledby="artist-signup-title" data-nosnippet>
            <h2 id="artist-signup-title">Rejoindre le projet</h2>
            <p>Orum nava, seli maren, velora senu. Nali veyra, meriva tolun, aruma nesori.</p>
            <form action="https://formspree.io/f/xoejjlgd" method="POST">
                <input type="hidden" name="_subject" value="Nouvelle candidature pour rejoindre duan rA">
                <div class="artist-signup-fields">
                    <label>
                        Nom d'artiste
                        <input type="text" name="name" autocomplete="off" maxlength="100" placeholder="Un nom spécifique à ce projet, à créer pour collaborer" required>
                        <small>Ce nom doit être propre au projet : crée-en un nouveau pour collaborer avec nous.</small>
                    </label>
                    <label>
                        Votre adresse e-mail
                        <input type="email" name="email" autocomplete="email" maxlength="254" required>
                    </label>
                    <label>
                        Votre pratique artistique
                        <input type="text" name="practice" maxlength="150" placeholder="Musique, arts visuels, création web…">
                    </label>
                    <label>
                        Quelques mots sur vous et votre envie de nous rejoindre
                        <textarea name="message" rows="5" maxlength="3000" required></textarea>
                    </label>
                    <input type="text" name="_gotcha" class="artist-signup-trap" tabindex="-1" autocomplete="off" aria-hidden="true">
                    <label class="artist-signup-consent">
                        <input type="checkbox" name="consent" required>
                        <span>J'accepte que ces informations soient transmises au projet duan rA (via Formspree) pour répondre à ma proposition. Voir les <a href="mentions_légales.html">mentions légales</a>.</span>
                    </label>
                </div>
                <button type="submit">Envoyer ma proposition</button>
            </form>
        </section>
        <div class='div_footer'>
            <a href="mailto:projet.duanra@orange.fr" aria-label="Envoyer un email à duan rA">
